name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Release Keystore
        run: |
          if [ ! -f "android/app/belanjaku-release.jks" ]; then
            keytool -genkeypair -v -keystore android/app/belanjaku-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias belanjaku -storepass belanjaku2026 -keypass belanjaku2026 -dname "CN=BELANJAKU, OU=Mobile, O=Bengkel, L=Samarinda, ST=Kaltim, C=ID"
          fi
          echo "storePassword=belanjaku2026" > android/key.properties
          echo "keyPassword=belanjaku2026" >> android/key.properties
          echo "keyAlias=belanjaku" >> android/key.properties
          echo "storeFile=belanjaku-release.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: |
          set +e
          flutter test --reporter expanded > test_output.log 2>&1
          TEST_EXIT=$?
          echo "### Flutter Test Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $TEST_EXIT -ne 0 ]; then
            cat test_output.log
            exit $TEST_EXIT
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BELANJAKU-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "BELANJAKU v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## 🛍️ BELANJAKU — Aplikasi Pencatatan Keuangan Pribadi & Scan Struk
            - **Versi:** 1.0.0
            - **Build Number:** ${{ github.run_number }}
            - **Commit SHA:** ${{ github.sha }}
            - **Signing:** Release Keystore (Bukan Debug)
            - **Fitur Utama:**
              - Input cepat dengan custom numpad
              - Scan struk otomatis on-device OCR (Indomaret, Alfamart, SPBU, dsb)
              - Multi-dompet & transfer saldo berpasangan
              - Anggaran bulanan dengan alert 80% & 100%
              - Grafik donat & tren pengeluaran harian
              - Export CSV & backup-restore ZIP lokal
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
