name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Release Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: |
          set +e
          flutter test --reporter expanded > test_output.log 2>&1
          TEST_EXIT=$?
          if [ $TEST_EXIT -ne 0 ]; then
            grep -E "FAIL|Expected:|Actual:|Which:|EXCEPTION|Error" test_output.log | head -n 25 | while read -r line; do
              echo "::error title=Test Failure::$line"
            done
            cat test_output.log
            exit $TEST_EXIT
          fi

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release > build_output.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            awk '/\* What went wrong:/,/\* Try:/' build_output.log | while read -r line; do
              echo "::error title=What Went Wrong::$line"
            done
            grep -E "FAILURE|FAILED|Error:|error:|Exception:|Caused by:" build_output.log | tail -n 25 | while read -r line; do
              echo "::error title=Build Failure::$line"
            done
            tail -n 120 build_output.log
            exit $BUILD_EXIT
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BELANJAKU-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "BELANJAKU v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## ⚠️ PEMBERITAHUAN PENTING MIGRASI KE-BUILD 10:
            > **Kunci signing diganti.** APK ini **TIDAK BISA** update timpa APK Build 9.  
            > **Backup data dulu** (export CSV / backup ZIP di aplikasi), **uninstall APK lama**, baru install APK baru.

            ---

            ## 🛍️ BELANJAKU — Aplikasi Pencatatan Keuangan Pribadi & Scan Struk
            - **Versi:** 1.0.0
            - **Build Number:** ${{ github.run_number }}
            - **Commit SHA:** ${{ github.sha }}
            - **Signing:** Release Keystore Baru (GitHub Secrets)
            - **Fitur Utama:**
              - Input cepat dengan custom numpad
              - Scan struk otomatis on-device OCR (Indomaret, Alfamart, SPBU, dsb)
              - Multi-dompet & transfer saldo berpasangan
              - Anggaran bulanan dengan alert 80% & 100%
              - Grafik donat & tren pengeluaran harian
              - Export CSV & backup-restore ZIP lokal
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
